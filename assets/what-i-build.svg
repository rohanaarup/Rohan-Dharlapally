<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background: transparent;">
  <defs>
    <linearGradient id="panelBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>

    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262D" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes flowPacketLeft {
      0% { cx: 40px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 400px; opacity: 0; }
    }
    @keyframes flowPacketRight {
      0% { cx: 40px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 400px; opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -40; }
    }
    .packet-left {
      animation: flowPacketLeft 3.2s linear infinite;
    }
    .packet-right {
      animation: flowPacketRight 3.2s linear infinite;
      animation-delay: 0.8s;
    }
    .pulse-elem {
      animation: pulseGlow 2s ease-in-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 6, 4;
      animation: waveDash 1.5s linear infinite;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- ==================== LEFT PANEL: BACKEND ENGINEERING ==================== -->
  <g transform="translate(10, 10)">
    <!-- Card Base -->
    <rect x="0" y="0" width="440" height="300" rx="12" fill="url(#panelBgGrad)"/>
    <rect x="0" y="0" width="440" height="300" rx="12" fill="url(#cardGrid)"/>
    <rect x="0" y="0" width="440" height="300" rx="12" fill="none" stroke="#30363D" stroke-width="1.2"/>
    <!-- Top accent line -->
    <path d="M 12 0 L 428 0" stroke="url(#orangeAccent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Panel Header: Icon & Title -->
    <g transform="translate(24, 24)">
      <!-- Server Icon in burnt orange -->
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#1C2128" stroke="#FF6B35" stroke-width="1"/>
      <path d="M7 11h18M7 16h18M7 21h18" stroke="#FF6B35" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="21" cy="11" r="1.2" fill="#FFA07A"/>
      <circle cx="21" cy="16" r="1.2" fill="#FFA07A"/>
      <circle cx="21" cy="21" r="1.2" fill="#FFA07A"/>

      <text x="42" y="15" fill="#F0F6FC" font-size="14" class="font-sans" font-weight="700">BACKEND &amp; DATA SYSTEMS</text>
      <text x="42" y="28" fill="#8B949E" font-size="11" class="font-mono">DISCIPLINE // DISTRIBUTED ARCHITECTURE</text>
    </g>

    <!-- Status Badge -->
    <g transform="translate(290, 24)">
      <rect x="0" y="0" width="126" height="24" rx="12" fill="#161B22" stroke="#FF6B35" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="10" cy="12" r="3" fill="#FF6B35" class="pulse-elem"/>
      <text x="18" y="16" fill="#FF8E53" font-size="10" class="font-mono" font-weight="600">LATENCY &lt; 25MS</text>
    </g>

    <!-- Engineering Capabilities List -->
    <g transform="translate(24, 76)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <polygon points="0,5 6,8 0,11" fill="#FF6B35"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">High-Throughput REST APIs</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Engineered with Python, Django, DRF &amp; JWT auth</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 38)">
        <polygon points="0,5 6,8 0,11" fill="#FF6B35"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Relational Modeling &amp; Tuning</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">PostgreSQL indexing, transaction safety &amp; schema design</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 76)">
        <polygon points="0,5 6,8 0,11" fill="#FF6B35"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">In-Memory Cache &amp; Queuing</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Redis caching, rate-limiting &amp; background tasks</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 114)">
        <polygon points="0,5 6,8 0,11" fill="#FF6B35"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Security &amp; Access Control</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Granular Role-Based Access Control (RBAC) &amp; token flow</text>
      </g>
    </g>

    <!-- Animated Telemetry Pipeline (Progress / Activity Stream) -->
    <g transform="translate(20, 238)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#0A0D12" stroke="#21262D" stroke-width="1"/>
      <!-- Pipeline Track -->
      <line x1="30" y1="21" x2="370" y2="21" stroke="#21262D" stroke-width="2"/>
      <line x1="30" y1="21" x2="370" y2="21" stroke="#FF6B35" stroke-opacity="0.7" stroke-width="2" class="dash-flow"/>

      <!-- Pipeline Nodes -->
      <circle cx="50" cy="21" r="5" fill="#161B22" stroke="#FF6B35" stroke-width="1.5"/>
      <circle cx="150" cy="21" r="5" fill="#161B22" stroke="#FF6B35" stroke-width="1.5"/>
      <circle cx="250" cy="21" r="5" fill="#161B22" stroke="#FF6B35" stroke-width="1.5"/>
      <circle cx="350" cy="21" r="5" fill="#161B22" stroke="#FF6B35" stroke-width="1.5"/>

      <!-- Node labels -->
      <text x="50" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">CLIENT</text>
      <text x="150" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">GATEWAY</text>
      <text x="250" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">ORM</text>
      <text x="350" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">DATABASE</text>

      <!-- Animated Moving Data Packet -->
      <circle cy="21" r="4.5" fill="#FF8E53" class="packet-left"/>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: FULL-STACK & ENTERPRISE ==================== -->
  <g transform="translate(470, 10)">
    <!-- Card Base -->
    <rect x="0" y="0" width="440" height="300" rx="12" fill="url(#panelBgGrad)"/>
    <rect x="0" y="0" width="440" height="300" rx="12" fill="url(#cardGrid)"/>
    <rect x="0" y="0" width="440" height="300" rx="12" fill="none" stroke="#30363D" stroke-width="1.2"/>
    <!-- Top accent line -->
    <path d="M 12 0 L 428 0" stroke="url(#purpleAccent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Panel Header: Icon & Title -->
    <g transform="translate(24, 24)">
      <!-- Layers / Device Icon in subtle purple -->
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#1C2128" stroke="#8B5CF6" stroke-width="1"/>
      <path d="M8 12l8-4 8 4-8 4-8-4z" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
      <path d="M8 17l8 4 8-4" stroke="#A78BFA" stroke-width="1.5" fill="none"/>
      <path d="M8 22l8 4 8-4" stroke="#C4B5FD" stroke-width="1.5" fill="none"/>

      <text x="42" y="15" fill="#F0F6FC" font-size="14" class="font-sans" font-weight="700">FULL-STACK &amp; ENTERPRISE</text>
      <text x="42" y="28" fill="#8B949E" font-size="11" class="font-mono">DISCIPLINE // SYSTEMS &amp; WORKFLOWS</text>
    </g>

    <!-- Status Badge -->
    <g transform="translate(290, 24)">
      <rect x="0" y="0" width="126" height="24" rx="12" fill="#161B22" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="10" cy="12" r="3" fill="#8B5CF6" class="pulse-elem"/>
      <text x="18" y="16" fill="#C4B5FD" font-size="10" class="font-mono" font-weight="600">MULTI-CLIENT SYNC</text>
    </g>

    <!-- Engineering Capabilities List -->
    <g transform="translate(24, 76)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <polygon points="0,5 6,8 0,11" fill="#8B5CF6"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Cross-Platform Applications</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Production mobile apps via Flutter, Dart &amp; reactive state</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 38)">
        <polygon points="0,5 6,8 0,11" fill="#8B5CF6"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Component UI &amp; Web Portals</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Modern, accessible admin &amp; student portals in React &amp; Vue</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 76)">
        <polygon points="0,5 6,8 0,11" fill="#8B5CF6"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Enterprise ERP &amp; Helpdesk</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Custom multi-app business suites on Frappe &amp; ERPNext</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 114)">
        <polygon points="0,5 6,8 0,11" fill="#8B5CF6"/>
        <text x="14" y="9" fill="#E6EDF3" font-size="12" class="font-sans" font-weight="600">Containerized Deployment</text>
        <text x="14" y="23" fill="#8B949E" font-size="11" class="font-sans">Docker containerization, Git workflows &amp; automated CI/CD</text>
      </g>
    </g>

    <!-- Animated Telemetry Pipeline (Progress / Activity Stream) -->
    <g transform="translate(20, 238)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#0A0D12" stroke="#21262D" stroke-width="1"/>
      <!-- Pipeline Track -->
      <line x1="30" y1="21" x2="370" y2="21" stroke="#21262D" stroke-width="2"/>
      <line x1="30" y1="21" x2="370" y2="21" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="2" class="dash-flow"/>

      <!-- Pipeline Nodes -->
      <circle cx="50" cy="21" r="5" fill="#161B22" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="150" cy="21" r="5" fill="#161B22" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="250" cy="21" r="5" fill="#161B22" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="350" cy="21" r="5" fill="#161B22" stroke="#8B5CF6" stroke-width="1.5"/>

      <!-- Node labels -->
      <text x="50" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">FLUTTER/UI</text>
      <text x="150" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">REST API</text>
      <text x="250" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">FRAPPE ERP</text>
      <text x="350" y="34" text-anchor="middle" fill="#6E7681" font-size="8" class="font-mono">DEPLOYMENT</text>

      <!-- Animated Moving Data Packet -->
      <circle cy="21" r="4.5" fill="#C4B5FD" class="packet-right"/>
    </g>
  </g>
</svg>