<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="300" style="background: transparent;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="50%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262D" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }
    @keyframes scanSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes wavePulse {
      0%, 100% { height: 14px; y: 198px; }
      50% { height: 32px; y: 180px; }
    }
    .beacon-pulse {
      animation: pulseBeacon 2.5s infinite ease-in-out;
      transform-origin: 52px 42px;
    }
    .cursor-elem {
      animation: cursorBlink 1.1s infinite;
    }
    .radar-rotator {
      transform-origin: 770px 150px;
      animation: scanSweep 9s linear infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="916" height="296" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="916" height="296" rx="14" fill="url(#gridPattern)"/>
  <rect x="2" y="2" width="916" height="296" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Header Status Pill -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="370" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Blinking dot -->
    <circle cx="14" cy="13" r="4.5" fill="#FF6B35" class="beacon-pulse"/>
    <circle cx="14" cy="13" r="2.5" fill="#FFA07A"/>
    <text x="28" y="17" fill="#C9D1D9" font-size="11" class="text-mono" font-weight="600" letter-spacing="1">SYSTEM ONLINE // CORE: BACKEND &amp; DISTRIBUTED</text>
  </g>

  <!-- Name & Typography -->
  <text x="40" y="112" fill="#F0F6FC" font-size="38" class="text-title">ROHAN DHARLAPALLY</text>

  <!-- Dynamic Role / Terminal Prompt -->
  <g transform="translate(40, 142)">
    <text x="0" y="0" fill="#FF6B35" font-size="18" class="text-mono" font-weight="700">&gt;</text>
    <text x="18" y="0" fill="#E6EDF3" font-size="16" class="text-title" font-weight="600">Full-Stack Developer</text>
    <text x="175" y="0" fill="#8B949E" font-size="16" class="text-title" font-weight="400">·</text>
    <text x="188" y="0" fill="#C9D1D9" font-size="16" class="text-title" font-weight="500">Backend Systems Specialist</text>
    <!-- Blinking Cursor -->
    <rect x="406" y="-14" width="8" height="18" fill="#FF6B35" class="cursor-elem" rx="1"/>
  </g>

  <!-- Secondary Philosophy / Architecture Tagline -->
  <text x="40" y="172" fill="#8B949E" font-size="13.5" class="text-title">
    Architecting robust REST APIs, resilient relational models, and scalable enterprise workflows.
  </text>

  <!-- Technical Discipline Badges -->
  <g transform="translate(40, 204)">
    <!-- Badge 1: Python & Django -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="30" rx="6" fill="#161B22" stroke="#FF6B35" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="15" r="3" fill="#FF6B35"/>
      <text x="26" y="19" fill="#F0F6FC" font-size="12" class="text-mono" font-weight="600">Python · Django</text>
    </g>

    <!-- Badge 2: PostgreSQL & Redis -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="144" height="30" rx="6" fill="#161B22" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="15" r="3" fill="#8B5CF6"/>
      <text x="26" y="19" fill="#F0F6FC" font-size="12" class="text-mono" font-weight="600">PostgreSQL · Redis</text>
    </g>

    <!-- Badge 3: React & Flutter -->
    <g transform="translate(302, 0)">
      <rect x="0" y="0" width="132" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="14" cy="15" r="3" fill="#58A6FF"/>
      <text x="26" y="19" fill="#C9D1D9" font-size="12" class="text-mono" font-weight="600">React · Flutter</text>
    </g>

    <!-- Badge 4: Frappe & Docker -->
    <g transform="translate(444, 0)">
      <rect x="0" y="0" width="134" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="14" cy="15" r="3" fill="#3FB950"/>
      <text x="26" y="19" fill="#C9D1D9" font-size="12" class="text-mono" font-weight="600">Frappe · Docker</text>
    </g>
  </g>

  <!-- Right Visual: Engineering Radar & Telemetry Display -->
  <g transform="translate(770, 150)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#21262D" stroke-width="1" stroke-dasharray="3,5"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#30363D" stroke-width="1"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#21262D" stroke-width="1" stroke-dasharray="2,4"/>
    <circle cx="0" cy="0" r="18" fill="#161B22" stroke="#FF6B35" stroke-width="1.5"/>

    <!-- Crosshair axes -->
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#21262D" stroke-width="0.75"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#21262D" stroke-width="0.75"/>

    <!-- Rotating Radar Sector -->
    <g class="radar-rotator">
      <path d="M 0 0 L 105 0 A 105 105 0 0 0 74 -74 Z" fill="url(#radarBeam)"/>
      <line x1="0" y1="0" x2="105" y2="0" stroke="#FF6B35" stroke-width="1.5"/>
    </g>

    <!-- Core telemetry dots -->
    <circle cx="38" cy="-28" r="2.5" fill="#FF6B35" opacity="0.8"/>
    <circle cx="-52" cy="35" r="2.5" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="-25" cy="-60" r="2" fill="#58A6FF" opacity="0.7"/>

    <!-- Center Monogram -->
    <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="10" class="text-mono" font-weight="800">RD</text>
  </g>

  <!-- Telemetry Specs Footer Inside Hero -->
  <g transform="translate(40, 260)">
    <text x="0" y="0" fill="#6E7681" font-size="11" class="text-mono">LOCATION: HYDERABAD, IN</text>
    <text x="175" y="0" fill="#484F58" font-size="11" class="text-mono">|</text>
    <text x="195" y="0" fill="#6E7681" font-size="11" class="text-mono">EXPLORING: AI ENGINEERING (RAG) &amp; SAP BTP</text>
    <text x="495" y="0" fill="#484F58" font-size="11" class="text-mono">|</text>
    <text x="515" y="0" fill="#6E7681" font-size="11" class="text-mono">UPTIME: 99.9%</text>
  </g>
</svg>