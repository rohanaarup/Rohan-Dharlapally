      <line x1="360" y1="-19" x2="360" y2="-37" stroke="#FF6B35" stroke-width="1.2"/>
      <circle cx="360" cy="-37" r="2.5" fill="#FF6B35" class="city-dot"/>
    </g>

    <!-- Building at (0, -2) h=135 -->
    <g>
      <!-- Left Face -->
      <polygon points="386,-1 412,12 412,147 386,134" fill="#1C2128" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
      <polygon points="412,12 438,-1 438,134 412,147" fill="#12161F" stroke="#21262D" stroke-width="0.6"/>
      <!-- Top Face -->
