<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skylineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="60%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>

    <!-- Skyline Horizon Glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0D12" stop-opacity="0"/>
    </radialGradient>

    <pattern id="skyGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262D" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <!-- Beacon filter -->
    <filter id="cityGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes beamRise {
      0% { y1: 220px; y2: 200px; opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 1; }
      100% { y1: 70px; y2: 50px; opacity: 0; }
    }
    @keyframes pulseCityDot {
      0%, 100% { opacity: 0.4; r: 2px; }
      50% { opacity: 1; r: 3.5px; }
    }
    .beam-1 { animation: beamRise 3.5s linear infinite; }
    .beam-2 { animation: beamRise 4.2s linear infinite; animation-delay: 1.2s; }
    .beam-3 { animation: beamRise 3.8s linear infinite; animation-delay: 2.1s; }
    .beam-4 { animation: beamRise 4.5s linear infinite; animation-delay: 0.6s; }
    .city-dot { animation: pulseCityDot 2.2s infinite ease-in-out; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Base Canvas -->
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#skylineBg)"/>
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#skyGrid)"/>
  <rect x="2" y="2" width="916" height="276" rx="14" fill="none" stroke="#21262D" stroke-width="1.2"/>

  <!-- Horizon Ambient Glow -->
  <circle cx="560" cy="200" r="260" fill="url(#horizonGlow)"/>

  <!-- Header Info -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="260" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#FF6B35"/>
    <text x="24" y="16" fill="#C9D1D9" font-size="10.5" class="font-mono" font-weight="600" letter-spacing="1">CONTRIBUTION ARCHITECTURE</text>
  </g>
  <text x="40" y="78" fill="#F0F6FC" font-size="20" class="font-sans" font-weight="700">Futuristic Contribution Skyline</text>
  <text x="40" y="96" fill="#8B949E" font-size="12" class="font-sans">Isometric cityscape reflecting commit velocity, codebase evolution, and system stability</text>

  <!-- Left Stats / Spec Legend -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="16" y="24" fill="#FF8E53" font-size="10.5" class="font-mono" font-weight="700">NODE METRICS</text>

    <text x="16" y="48" fill="#8B949E" font-size="10.5" class="font-sans">Architecture</text>
    <text x="120" y="48" fill="#F0F6FC" font-size="10.5" class="font-mono">3D ISOMETRIC</text>

    <text x="16" y="70" fill="#8B949E" font-size="10.5" class="font-sans">Peak Nodes</text>
    <text x="120" y="70" fill="#FF8E53" font-size="10.5" class="font-mono">BURNT ORANGE</text>

    <text x="16" y="92" fill="#8B949E" font-size="10.5" class="font-sans">Core Conduits</text>
    <text x="120" y="92" fill="#C4B5FD" font-size="10.5" class="font-mono">PURPLE DATA</text>
  </g>

  <!-- ==================== ISOMETRIC SKYLINE / SERVER MATRIX ==================== -->
  <!-- Isometric projection: x_iso = (x - y) * cos(30), y_iso = (x + y) * sin(30) - height -->
  <g transform="translate(260, -10)">

    <!-- Building at (-3, -2) h=50 -->
    <g>
      <!-- Left Face -->
      <polygon points="308,45 334,58 334,108 308,95" fill="#12161F" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
      <polygon points="334,58 360,45 360,95 334,108" fill="#0A0D12" stroke="#21262D" stroke-width="0.6"/>
      <!-- Top Face -->
      <polygon points="334,32 360,45 334,58 308,45" fill="#161B22" stroke="#21262D" stroke-width="0.8"/>
    </g>

    <!-- Building at (-3, -1) h=65 -->
    <g>
      <!-- Left Face -->
      <polygon points="282,43 308,56 308,121 282,108" fill="#161B22" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
      <polygon points="308,56 334,43 334,108 308,121" fill="#0E1217" stroke="#21262D" stroke-width="0.6"/>
      <!-- Top Face -->
      <polygon points="308,30 334,43 308,56 282,43" fill="#21262D" stroke="#30363D" stroke-width="0.8"/>
    </g>

    <!-- Building at (-2, -2) h=75 -->
    <g>
      <!-- Left Face -->
      <polygon points="334,33 360,46 360,121 334,108" fill="#161B22" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
