      <!-- Top Face -->
      <polygon points="360,20 386,33 360,46 334,33" fill="#21262D" stroke="#30363D" stroke-width="0.8"/>
    </g>

    <!-- Building at (-3, 0) h=45 -->
    <g>
      <!-- Left Face -->
      <polygon points="256,76 282,89 282,134 256,121" fill="#12161F" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
      <polygon points="282,89 308,76 308,121 282,134" fill="#0A0D12" stroke="#21262D" stroke-width="0.6"/>
      <!-- Top Face -->
      <polygon points="282,63 308,76 282,89 256,76" fill="#161B22" stroke="#21262D" stroke-width="0.8"/>
    </g>

    <!-- Building at (-2, -1) h=95 -->
    <g>
      <!-- Left Face -->
      <polygon points="308,26 334,39 334,134 308,121" fill="#1C2128" stroke="#21262D" stroke-width="0.6"/>
      <!-- Right Face -->
      <polygon points="334,39 360,26 360,121 334,134" fill="#12161F" stroke="#21262D" stroke-width="0.6"/>
      <!-- Top Face -->
      <polygon points="334,13 360,26 334,39 308,26" fill="#FF6B35" stroke="#FFA07A" stroke-width="0.8"/>
    </g>

    <!-- Building at (-1, -2) h=110 -->
    <g>
      <!-- Left Face -->
