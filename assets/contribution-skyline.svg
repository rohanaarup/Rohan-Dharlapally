      <!-- Top Face -->
      <polygon points="386,-31 412,-18 386,-5 360,-18" fill="#FF6B35" stroke="#FFA07A" stroke-width="0.8"/>
      <line x1="386" y1="31.666666666666664" x2="412" y2="18.666666666666664" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
      <line x1="386" y1="68.33333333333333" x2="412" y2="55.33333333333333" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
      <line x1="386" y1="105.0" x2="412" y2="92.0" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>

