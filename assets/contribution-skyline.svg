      <line x1="386" y1="48.44444444444444" x2="412" y2="35.44444444444444" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
      <line x1="386" y1="72.88888888888889" x2="412" y2="59.888888888888886" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
