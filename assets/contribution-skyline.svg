      <line x1="360" y1="71.88888888888889" x2="386" y2="58.888888888888886" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
      <line x1="360" y1="100.77777777777777" x2="386" y2="87.77777777777777" stroke="#FF8E53" stroke-width="0.5" stroke-opacity="0.4"/>
