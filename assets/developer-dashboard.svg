<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280" style="background: transparent;">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="50%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E1217"/>
    </linearGradient>

    <linearGradient id="idBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="dashGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262D" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <filter id="dashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseActive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-dot {
      animation: pulseActive 2s infinite ease-in-out;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Base Container -->
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#dashBg)"/>
  <rect x="2" y="2" width="916" height="276" rx="14" fill="url(#dashGrid)"/>
  <rect x="2" y="2" width="916" height="276" rx="14" fill="none" stroke="#21262D" stroke-width="1.2"/>

  <!-- ==================== LEFT: DEVELOPER ID CARD ==================== -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="310" height="240" rx="10" fill="url(#cardGrad)" stroke="url(#idBorder)" stroke-width="1.5" filter="url(#dashGlow)"/>

    <!-- ID Header Strip -->
    <rect x="0" y="0" width="310" height="34" rx="10" fill="#1C2128"/>
    <!-- Overlap mask to keep bottom straight -->
    <rect x="0" y="24" width="310" height="10" fill="#1C2128"/>
    <text x="16" y="22" fill="#8B949E" font-size="10" class="font-mono" font-weight="700" letter-spacing="1.5">ENGINEERING IDENTITY // VERIFIED</text>
    <circle cx="290" cy="17" r="4" fill="#3FB950" class="pulse-dot"/>

    <!-- Avatar Monogram Badge -->
    <g transform="translate(20, 52)">
      <!-- Avatar Outer -->
      <circle cx="28" cy="28" r="28" fill="#0D1117" stroke="#FF6B35" stroke-width="2"/>
      <circle cx="28" cy="28" r="24" fill="#161B22"/>
      <text x="28" y="35" text-anchor="middle" fill="#F0F6FC" font-size="18" class="font-mono" font-weight="800">RD</text>

      <!-- Verified check badge -->
      <circle cx="48" cy="48" r="9" fill="#161B22" stroke="#8B5CF6" stroke-width="1.5"/>
      <path d="M44 48l3 3 5-5" stroke="#8B5CF6" stroke-width="1.6" fill="none" stroke-linecap="round"/>

      <!-- Name & Handle -->
      <text x="70" y="22" fill="#F0F6FC" font-size="16" class="font-sans" font-weight="700">Rohan Dharlapally</text>
      <text x="70" y="38" fill="#FF8E53" font-size="12" class="font-mono" font-weight="600">@rohanaarup</text>
      <text x="70" y="52" fill="#8B949E" font-size="10.5" class="font-sans">Full-Stack &amp; Backend Dev</text>
    </g>

    <!-- Meta Details Table -->
    <g transform="translate(20, 130)">
      <line x1="0" y1="0" x2="270" y2="0" stroke="#30363D" stroke-width="1"/>

      <text x="0" y="20" fill="#8B949E" font-size="10.5" class="font-mono">DISCIPLINE</text>
      <text x="110" y="20" fill="#C9D1D9" font-size="10.5" class="font-sans" font-weight="600">Backend Systems</text>

      <text x="0" y="42" fill="#8B949E" font-size="10.5" class="font-mono">PRIMARY DB</text>
      <text x="110" y="42" fill="#C9D1D9" font-size="10.5" class="font-sans" font-weight="600">PostgreSQL / Redis</text>

      <text x="0" y="64" fill="#8B949E" font-size="10.5" class="font-mono">FRAMEWORKS</text>
      <text x="110" y="64" fill="#C9D1D9" font-size="10.5" class="font-sans" font-weight="600">Django · DRF · Frappe</text>

      <text x="0" y="86" fill="#8B949E" font-size="10.5" class="font-mono">STATUS</text>
      <text x="110" y="86" fill="#3FB950" font-size="10.5" class="font-mono" font-weight="600">ACTIVE &amp; AVAILABLE</text>
    </g>
  </g>

  <!-- ==================== RIGHT: TELEMETRY & SPECIFICATION MATRIX ==================== -->
  <g transform="translate(350, 20)">
    <!-- Column 1: Core Architecture -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="240" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <path d="M 0 6 L 0 234" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
      <text x="16" y="26" fill="#FF8E53" font-size="11" class="font-mono" font-weight="700">CORE SERVICES</text>
      <text x="16" y="42" fill="#8B949E" font-size="9.5" class="font-mono">BACKEND TIER</text>

      <line x1="16" y1="52" x2="154" y2="52" stroke="#21262D" stroke-width="1"/>

      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Django REST</text>
        <text x="0" y="14" fill="#8B949E" font-size="10" class="font-sans">Scalable API routes</text>

        <text x="0" y="40" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">PostgreSQL</text>
        <text x="0" y="54" fill="#8B949E" font-size="10" class="font-sans">Optimized schemas</text>

        <text x="0" y="80" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Redis Cache</text>
        <text x="0" y="94" fill="#8B949E" font-size="10" class="font-sans">Sub-millisecond data</text>

        <text x="0" y="120" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">JWT &amp; RBAC</text>
        <text x="0" y="134" fill="#8B949E" font-size="10" class="font-sans">Granular security</text>
      </g>
    </g>

    <!-- Column 2: Client & Enterprise Systems -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="170" height="240" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <path d="M 0 6 L 0 234" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
      <text x="16" y="26" fill="#C4B5FD" font-size="11" class="font-mono" font-weight="700">CLIENT &amp; ERP</text>
      <text x="16" y="42" fill="#8B949E" font-size="9.5" class="font-mono">FULL-STACK TIER</text>

      <line x1="16" y1="52" x2="154" y2="52" stroke="#21262D" stroke-width="1"/>

      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Flutter Mobile</text>
        <text x="0" y="14" fill="#8B949E" font-size="10" class="font-sans">Android / iOS UI</text>

        <text x="0" y="40" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">React &amp; Vue</text>
        <text x="0" y="54" fill="#8B949E" font-size="10" class="font-sans">Dashboard portals</text>

        <text x="0" y="80" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Frappe ERP</text>
        <text x="0" y="94" fill="#8B949E" font-size="10" class="font-sans">ERPNext workflows</text>

        <text x="0" y="120" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Docker &amp; CI/CD</text>
        <text x="0" y="134" fill="#8B949E" font-size="10" class="font-sans">Container workflows</text>
      </g>
    </g>

    <!-- Column 3: Advanced Focus & Research -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="180" height="240" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <path d="M 0 6 L 0 234" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
      <text x="16" y="26" fill="#79C0FF" font-size="11" class="font-mono" font-weight="700">SPECIALIZATION</text>
      <text x="16" y="42" fill="#8B949E" font-size="9.5" class="font-mono">EXPLORATION TIER</text>

      <line x1="16" y1="52" x2="164" y2="52" stroke="#21262D" stroke-width="1"/>

      <g transform="translate(16, 70)">
        <text x="0" y="0" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">AI Engineering</text>
        <text x="0" y="14" fill="#8B949E" font-size="10" class="font-sans">RAG &amp; Vector Search</text>

        <text x="0" y="40" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">SAP BTP</text>
        <text x="0" y="54" fill="#8B949E" font-size="10" class="font-sans">Enterprise cloud</text>

        <text x="0" y="80" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">Clean Architecture</text>
        <text x="0" y="94" fill="#8B949E" font-size="10" class="font-sans">Decoupled design</text>

        <text x="0" y="120" fill="#F0F6FC" font-size="11.5" class="font-sans" font-weight="600">System Profiling</text>
        <text x="0" y="134" fill="#8B949E" font-size="10" class="font-sans">Query optimization</text>
      </g>
    </g>
  </g>
</svg>